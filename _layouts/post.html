---
layout: default
---
<article class="post reveal">
  <p class="eyebrow">{{ page.date | date: '%B %-d, %Y' }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="prose">{{ content }}</div>
</article>
<p class="back"><a class="arrow-link" href="{{ '/blog/' | relative_url }}"><span>←</span> All posts</a></p>
